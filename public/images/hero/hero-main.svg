      <stop offset="0" stop-color="#4A3826"/>
      <stop offset="0.55" stop-color="#241B14"/>
      <stop offset="1" stop-color="#241B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.5"/>
